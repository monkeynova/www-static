<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrap Beast — Survive 100 Days</title>
<style>
  html, body { margin:0; padding:0; background:#0a0a0f; overflow:hidden;
    font-family:'Courier New', monospace; color:#cfe; height:100%; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#000; image-rendering:pixelated; box-shadow:0 0 40px #000; }
  #hint { position:fixed; bottom:8px; left:0; right:0; text-align:center;
    font-size:12px; color:#567; pointer-events:none; letter-spacing:1px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<div id="hint">WASD move · SPACE slam · SHIFT EMP · B shop (X = black market) · ENTER advance</div>
<script>
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ============================================================ INPUT */
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  initAudio();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const down = (...ks) => ks.some(k => keys[k]);
function justPressed(k){ if (pressed[k]){ pressed[k]=false; return true; } return false; }

/* ============================================================ HELPERS */
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const dist = (ax,ay,bx,by) => Math.hypot(ax-bx, ay-by);
const TAU = Math.PI*2;
function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function pointSegDist(px,py,x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy; if(l2===0) return dist(px,py,x1,y1);
  let tt=((px-x1)*dx+(py-y1)*dy)/l2; tt=clamp(tt,0,1); return dist(px,py,x1+tt*dx,y1+tt*dy); }

/* ============================================================ AUDIO (procedural, no assets) */
let AC = null;
function initAudio(){
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type='square', vol=0.12, slideTo=null){
  if (!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
function noiseBurst(dur, vol=0.2, lp=1200){
  if (!AC) return;
  const n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
const sfx = {
  slam(){ noiseBurst(0.18,0.25,800); tone(140,0.18,'square',0.18,60); },
  shard(){ tone(680,0.08,'square',0.08,1200); },
  hit(){ noiseBurst(0.1,0.18,1600); },
  pickup(){ tone(520,0.07,'square',0.12,820); tone(820,0.09,'square',0.1,1100); },
  build(){ tone(330,0.08,'square',0.12); tone(440,0.09,'square',0.12); tone(660,0.12,'square',0.12); },
  explode(){ noiseBurst(0.4,0.3,500); tone(90,0.4,'sawtooth',0.18,30); },
  shoot(){ tone(300,0.07,'sawtooth',0.07,120); },
  emp(){ tone(180,0.5,'sine',0.2,1400); noiseBurst(0.5,0.15,2200); },
  alarm(){ tone(880,0.15,'square',0.12); },
  zap(){ noiseBurst(0.3,0.25,3000); tone(1200,0.25,'sawtooth',0.12,200); },
  boss(){ tone(70,0.8,'sawtooth',0.22,50); tone(110,0.8,'square',0.12); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'square',0.14),i*140)); },
  dead(){ tone(330,0.6,'sawtooth',0.2,60); },
};

/* ============================================================ SCREEN SHAKE + RINGS */
let shake = 0;
const addShake = v => { shake = Math.min(shake+v, 26); };
const rings = [];
function ring(x,y,max,color,lw=3){ rings.push({x,y,r:4,max,color,lw}); }
function updateRings(){ for (let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.r+=(r.max-r.r)*0.18; if (r.max-r.r<2) rings.splice(i,1); } }
function drawRings(ox=0,oy=0){
  for (const r of rings){ ctx.globalAlpha=clamp(1-r.r/r.max,0,1); ctx.strokeStyle=r.color; ctx.lineWidth=r.lw;
    ctx.beginPath(); ctx.arc(r.x-ox,r.y-oy,r.r,0,TAU); ctx.stroke(); } ctx.globalAlpha=1;
}

/* ============================================================ PARTICLES */
const parts = [];
function spark(x,y,color,n=8,spd=3){ for(let i=0;i<n;i++) parts.push({x,y,vx:rand(-spd,spd),vy:rand(-spd,spd),life:rand(15,30),color}); }
function updateParts(){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--; if(p.life<=0) parts.splice(i,1); } }
function drawParts(ox=0,oy=0){ for(const p of parts){ ctx.globalAlpha=clamp(p.life/25,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x-ox-1.5,p.y-oy-1.5,3,3);} ctx.globalAlpha=1; }

/* ============================================================ PLAYER */
const player = {
  x:0, y:0, facing:1,
  hp:100, maxHp:100,
  scrap:0, gold:0, prism:0, diamond:0, wood:0,   // resources
  omega:false, // Omega Core: only thing that can pierce the Lab-Mecha
  mass:0,      // total scrap ever collected -> body size/cosmetics
  parts:{ armor:0, speed:0, weapon:0, core:0, tentacle:0, cannon:0, mortar:0 },
  speed:2.4, slamCd:0, hurtCd:0, cannonCd:0, mortarCd:0,
  energy:0, maxEnergy:50, empCd:0,
  holes:[], hitStreak:null,
  buffs:{ overdrive:0, shield:0, slow:0 },
};
function resetPlayer(){
  player.hp=player.maxHp=100; player.scrap=0; player.gold=0; player.prism=0; player.diamond=0; player.wood=0; player.omega=false; player.mass=0;
  player.parts={armor:0,speed:0,weapon:0,core:0,tentacle:0,cannon:0,mortar:0};
  player.energy=0; player.empCd=0; player.slamCd=0; player.cannonCd=0; player.mortarCd=0;
  player.holes=[]; player.hitStreak=null;
  player.buffs={overdrive:0,shield:0,slow:0};
  recalc();
}
const totalLevels = () => { const p=player.parts; return p.armor+p.speed+p.weapon+p.core+p.tentacle+p.cannon+p.mortar; };
function recalc(){
  const p=player.parts;
  player.maxHp = 100 + p.armor*40 + p.weapon*4 + p.core*6;
  player.speed = 2.2 + p.speed*0.5;
  player.maxEnergy = 50 + p.core*40;
  player.hp = Math.min(player.hp, player.maxHp);
}
const dmgMult = () => player.buffs.overdrive>0 ? 1.7 : 1;
const slamDmg = () => (20 + player.parts.weapon*16) * (1 + player.parts.core*0.08) * dmgMult();
const slamRange = () => 30 + player.parts.weapon*6 + beastR();
const dmgTaken = raw => raw * Math.pow(0.84, player.parts.armor) * (1 + player.holes.length*0.04);
function beastR(){ return 13 + Math.min(player.mass,10)*0.7 + totalLevels()*1.0; }
function playerDesc(){ const p=player.parts; return {r:beastR(), mass:player.mass, armor:p.armor, speed:p.speed, weapon:p.weapon, core:p.core, tentacle:p.tentacle, cannon:p.cannon, mortar:p.mortar, holes:player.holes}; }

/* ============================================================ STATE */
const S = { TITLE:'title', LAB:'lab', ESCAPE:'escape', WORLD:'world', OVER:'over', WIN:'win' };
let state = S.TITLE, t = 0;

/* ============================================================ THE BEAST (procedural) */
function drawBeast(x, y, d, facing, flash, rainbow){
  const r = d.r;
  ctx.save(); ctx.translate(x,y); ctx.scale(facing,1);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,r*0.85,r*1.05,r*0.4,0,0,TAU); ctx.fill();
  let body = flash?'#ffd9d9':'#9aa3ad', dark = flash?'#e8a':'#5c636b', bolt='#d9e2ea';
  if (rainbow){ const h=(t*6+x+y)%360; body=`hsl(${h},90%,65%)`; dark=`hsl(${(h+40)%360},90%,45%)`; bolt='#fff'; }

  // tentacles (behind hull) — count/length scale with level
  if (d.tentacle>0){
    const n=Math.min(6,d.tentacle), len=r*(1.0+d.tentacle*0.14);
    ctx.lineCap='round';
    for(let i=0;i<n;i++){
      const base=(i/n)*TAU + 0.4, bx=Math.cos(base)*r*0.55, by=Math.sin(base)*r*0.55;
      const sway=Math.sin(t*0.12+i*1.7), sway2=Math.cos(t*0.1+i);
      ctx.strokeStyle=flash?'#e0a8d8':'#7a5a8a'; ctx.lineWidth=4+d.tentacle*0.3;
      const mx=bx+Math.cos(base)*len*0.5+sway*7, my=by+Math.sin(base)*len*0.5+sway2*7;
      const ex=bx+Math.cos(base)*len+sway*14, ey=by+Math.sin(base)*len+sway*9;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
      ctx.fillStyle=flash?'#fce':'#9a7aaa'; ctx.beginPath(); ctx.arc(ex,ey,2.6,0,TAU); ctx.fill();
    }
  }

  // legs (cosmetic from mass)
  const legs = d.mass>=2 ? Math.min(6, d.mass-1) : 0;
  if (legs){ ctx.strokeStyle=dark; ctx.lineWidth=3; ctx.lineCap='round';
    for(let i=0;i<legs;i++){ const a=-0.7+i*(1.4/Math.max(1,legs-1)); const wob=Math.sin(t*0.15+i)*0.18;
      ctx.beginPath(); ctx.moveTo(-r*0.3, r*0.4);
      ctx.lineTo(-r*0.3 - Math.cos(a+wob)*r*0.95, r*0.6 + Math.sin(a+wob)*r*0.75); ctx.stroke(); } }

  // armor underplate (thicker outline per armor level)
  if (d.armor>0){ ctx.fillStyle=dark; ctx.beginPath();
    ctx.moveTo(-r*1.1,0); ctx.lineTo(0,-r*1.15); ctx.lineTo(r*1.1,0); ctx.lineTo(0,r*1.1); ctx.closePath(); ctx.fill(); }

  // hull
  ctx.fillStyle=body; ctx.strokeStyle=dark; ctx.lineWidth=2+d.armor;
  ctx.beginPath();
  ctx.moveTo(-r,0); ctx.lineTo(-r*0.6,-r*0.9); ctx.lineTo(r*0.2,-r);
  ctx.lineTo(r,-r*0.4); ctx.lineTo(r*0.9,r*0.5); ctx.lineTo(r*0.3,r);
  ctx.lineTo(-r*0.7,r*0.8); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle=dark; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-r*0.3,-r*0.8); ctx.lineTo(-r*0.1,r*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.4,-r*0.9); ctx.lineTo(r*0.2,r*0.9); ctx.stroke();

  ctx.fillStyle=bolt;
  for(const [bx,by] of [[-r*0.5,-r*0.4],[r*0.4,-r*0.5],[r*0.3,r*0.4],[-r*0.4,r*0.3]]){ ctx.beginPath(); ctx.arc(bx,by,1.8,0,TAU); ctx.fill(); }

  // weapon barrels (front)
  if (d.weapon>0){ ctx.fillStyle='#3a4048';
    for(let i=0;i<Math.min(3,d.weapon);i++){ ctx.fillRect(r*0.7, -6+i*6, 8+d.weapon*2, 3); } }

  // rail cannon (long barrel, front) — long-range part
  if (d.cannon>0){ ctx.fillStyle='#2a3038'; ctx.fillRect(r*0.4,-3, r*1.0+d.cannon*5, 6);
    ctx.fillStyle='#5fd0ff'; ctx.shadowColor='#5fd0ff'; ctx.shadowBlur=6;
    ctx.fillRect(r*0.4+r*1.0+d.cannon*5-3,-3,3,6); ctx.shadowBlur=0; }

  // mortar pods (tubes on the back) — exploding part
  if (d.mortar>0){ for(let i=0;i<Math.min(3,d.mortar);i++){ ctx.save(); ctx.translate(-r*0.5+i*5,-r*0.5); ctx.rotate(-0.5);
    ctx.fillStyle='#444b3a'; ctx.fillRect(-3,-r*0.6,6,r*0.6); ctx.fillStyle='#222'; ctx.fillRect(-3,-r*0.6,6,3); ctx.restore(); } }

  // core spire
  if (d.core>0 || d.mass>=4){ ctx.fillStyle='#3fd0c0'; ctx.shadowColor='#3fd0c0'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(-r*0.5,-r*0.6); ctx.lineTo(-r*0.2,-r*1.5-d.core*2); ctx.lineTo(0,-r*0.7); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }

  // eyes
  const eyes = 1 + Math.min(2, Math.floor(d.mass/3));
  for(let i=0;i<eyes;i++){ ctx.fillStyle=flash?'#fff':'#ff5a3c'; ctx.shadowColor='#ff5a3c'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(r*0.45-i*5,-r*0.2,2.4,0,TAU); ctx.fill(); ctx.shadowBlur=0; }

  // battle-damage holes — punched through after repeated hits to one spot
  if (d.holes){ for(const h of d.holes){ const hx=Math.cos(h.ang)*r*0.55, hy=Math.sin(h.ang)*r*0.55;
    ctx.fillStyle='#0a0c10'; ctx.beginPath();
    for(let k=0;k<7;k++){ const a=k/7*TAU, rr=h.r*(0.7+0.3*Math.sin(h.ang*3+k)); const px=hx+Math.cos(a)*rr, py=hy+Math.sin(a)*rr; k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=dark; ctx.lineWidth=1; ctx.stroke(); } }
  ctx.restore();
}
const allyDesc = a => ({r:a.invincible?22:16, mass:a.mass||3, armor:0, speed:1, weapon:1, core:0, tentacle:a.invincible?3:0});

/* ============================================================ SMALL SPRITES */
function drawScrap(x,y,wob,type){
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(wob)*0.3);
  let fill='#b8c0c8', edge='#666', glow=null;
  if (type==='gold'){ fill='#ffce4a'; edge='#a87a10'; glow='#ffce4a'; }
  else if (type==='prism'){ const h=(t*8+x*3)%360; fill=`hsl(${h},95%,62%)`; edge=`hsl(${(h+60)%360},90%,40%)`; glow=fill; }
  else if (type==='diamond'){ fill='#9ff7ff'; edge='#3aa'; glow='#bffaff'; }
  else if (type==='wood'){ fill='#9a6a3a'; edge='#5a3a1a'; }
  if (glow){ ctx.shadowColor=glow; ctx.shadowBlur=10; }
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-7,-4); ctx.lineTo(6,-7); ctx.lineTo(8,3); ctx.lineTo(-2,8); ctx.lineTo(-8,2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-1,1.4,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(3,2,1.4,0,TAU); ctx.fill();
  ctx.restore();
}
function drawSoldier(x,y,e){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,10,8,3,0,0,TAU); ctx.fill();
  ctx.fillStyle=e.color||'#4a5d3a'; ctx.fillRect(-5,-6,10,14);
  ctx.fillStyle='#caa'; ctx.beginPath(); ctx.arc(0,-10,4,0,TAU); ctx.fill();
  ctx.fillStyle='#3a4d2a'; ctx.fillRect(-5,-13,10,4);
  ctx.fillStyle='#222'; ctx.fillRect(2,-4,10,2);
  ctx.restore();
}
function drawSniper(x,y,e){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,10,8,3,0,0,TAU); ctx.fill();
  ctx.fillStyle='#5a4a2a'; ctx.fillRect(-5,-6,10,14);
  ctx.fillStyle='#caa'; ctx.beginPath(); ctx.arc(0,-10,4,0,TAU); ctx.fill();
  ctx.fillStyle='#222'; ctx.fillRect(-14,-3,28,2); // long rifle
  ctx.strokeStyle='rgba(255,60,60,0.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,14,0,TAU); ctx.stroke();
  ctx.restore();
}
function drawTank(x,y,e){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0,16,22,6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#3a3f30'; ctx.fillRect(-20,-6,40,22);
  ctx.fillStyle='#262a1e'; ctx.fillRect(-22,8,44,6);
  for(let i=0;i<6;i++){ ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-18+i*7,14,3,0,TAU); ctx.fill(); }
  ctx.fillStyle='#4a5038'; ctx.fillRect(-10,-14,20,12);
  const a=Math.atan2(player.y-e.y, player.x-e.x);
  ctx.rotate(a); ctx.fillStyle='#222'; ctx.fillRect(0,-3,28,6); ctx.rotate(-a);
  ctx.restore();
}
function drawHeli(x,y,e){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,28,16,5,0,0,TAU); ctx.fill();
  ctx.fillStyle='#2a3038'; ctx.beginPath(); ctx.ellipse(0,0,16,9,0,0,TAU); ctx.fill();
  ctx.fillRect(8,-2,18,4); // tail
  ctx.fillStyle='#1a1f24'; ctx.fillRect(22,-7,3,10);
  ctx.strokeStyle='#aab'; ctx.lineWidth=2; const r=(t%6<3)?26:6;
  ctx.beginPath(); ctx.moveTo(-r,-12); ctx.lineTo(r,-12); ctx.stroke(); // main rotor blur
  ctx.fillStyle='#79f'; ctx.beginPath(); ctx.arc(-6,-1,3,0,TAU); ctx.fill();
  ctx.restore();
}
function drawBoss(x,y,e){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(0,30,40,10,0,0,TAU); ctx.fill();
  // walker mech
  ctx.strokeStyle='#2a2e26'; ctx.lineWidth=7; ctx.lineCap='round';
  for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*14,8);
    ctx.lineTo(s*28, 20+Math.sin(t*0.1+s)*4); ctx.lineTo(s*22,34); ctx.stroke(); }
  ctx.fillStyle='#4a3030'; ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=3;
  ctx.fillRect(-26,-22,52,38); ctx.strokeRect(-26,-22,52,38);
  ctx.fillStyle='#6a2020'; ctx.fillRect(-20,-16,40,14);
  ctx.fillStyle=(t%20<10)?'#ff3030':'#a01010'; ctx.shadowColor='#f00'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(-8,-9,4,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(8,-9,4,0,TAU); ctx.fill(); ctx.shadowBlur=0;
  // twin cannons aim at player
  const a=Math.atan2(player.y-e.y, player.x-e.x);
  ctx.rotate(a); ctx.fillStyle='#111'; ctx.fillRect(0,-12,40,7); ctx.fillRect(0,5,40,7); ctx.rotate(-a);
  ctx.restore();
}
function drawScientist(s){
  ctx.save(); ctx.translate(s.x,s.y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,12,7,3,0,0,TAU); ctx.fill();
  ctx.fillStyle='#e8eef2'; ctx.fillRect(-5,-6,10,16);
  ctx.fillStyle='#d9b48f'; ctx.beginPath(); ctx.arc(0,-10,4,0,TAU); ctx.fill();
  ctx.fillStyle='#333'; ctx.fillRect(-4,-12,8,3);
  if (s.watching){ // vision cone toward cage + alarm
    ctx.fillStyle='rgba(255,60,60,0.12)'; const a=s.look;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,90,a-0.5,a+0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff4040'; ctx.font='bold 16px Courier New'; ctx.textAlign='center'; ctx.fillText('!',0,-20); ctx.textAlign='left';
  } else if (s.turning){
    ctx.fillStyle='#fa0'; ctx.font='bold 14px Courier New'; ctx.textAlign='center'; ctx.fillText('?',0,-20); ctx.textAlign='left';
  }
  ctx.restore();
}
function drawDino(x,y,s,kind){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,18,40,8,0,0,TAU); ctx.fill();
  ctx.fillStyle = kind===0 ? '#3a5a44' : '#5a4a3a';
  if (kind===0){ // brontosaurus
    ctx.beginPath(); ctx.ellipse(0,0,34,18,0,0,TAU); ctx.fill();
    ctx.lineWidth=14; ctx.strokeStyle='#3a5a44'; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(24,-2); ctx.quadraticCurveTo(54,-30,60,-46); ctx.stroke();
    ctx.beginPath(); ctx.arc(60,-48,7,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-28,0); ctx.quadraticCurveTo(-58,-6,-72,4); ctx.stroke();
    for(const lx of [-18,-4,12,24]){ ctx.fillRect(lx-4,12,8,16); }
  } else { // stegosaurus-ish
    ctx.beginPath(); ctx.ellipse(0,2,30,15,0,0,TAU); ctx.fill();

  ctx.fillStyle='#678'; ctx.font='13px Courier New'; ctx.fillText('▶ ENTER',W-130,H-32);
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const test=line+w+' ';
    if (ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,yy); line=w+' '; yy+=lh; } else line=test; }
  ctx.fillText(line,x,yy);
}
function advanceDialogue(onDone){
  if (justPressed('enter')){ dialogue.i++; if (dialogue.i>=dialogue.lines.length){ dialogue=null; if(onDone) onDone(); } }

let lab;
function initLab(){

    ],
    scraps:[
      { sx:cage.x+70, sy:cage.y-18, gx:cage.x+70, gy:cage.y+34, knocked:false, got:false, anim:0, wob:rand(0,6) },
      { sx:cage.x-18, sy:cage.y+130, gx:cage.x+34, gy:cage.y+130, knocked:false, got:false, anim:0, wob:rand(0,6) },
      { sx:cage.x+cage.w+18, sy:cage.y+80, gx:cage.x+cage.w-34, gy:cage.y+80, knocked:false, got:false, anim:0, wob:rand(0,6) },
    ],

      [40, ()=>say('SCIENTIST A',["Subject GB-7 is stabilizing. The scrap-core is binding to the chassis.","The generals want a beast that can level a continent in a week."])],
      [380,()=>say('SCIENTIST B',["You're sure it has no will of its own?","It's a weapon. It does what we forge it to do. Nothing more."])],
      [820,()=>say('GB-7 (you)',["...but I can hear you. I will NOT level continents. I will protect them.","There's scrap on the shelves outside these bars. If I SLAM the cage, I can shake it loose.","But the watchers will hear me. SLAM only when none of them are looking. Watch for the red eye."])],
    ], si:0,
  };
  state=S.LAB;
}
function labWatchers(){
  for (const s of lab.scientists){
    const cyc=300, local=(t+s.phase)%cyc;
    s.turning = local>=210 && local<235;
    s.watching = local>=235;
    // look toward cage center when watching
    const cx=lab.cage.x+lab.cage.w/2, cy=lab.cage.y+lab.cage.h/2;
    if (s.watching) s.look = Math.atan2(cy-s.y, cx-s.x);
  }
}
const anyoneWatching = () => lab.scientists.some(s=>s.watching);

function updateLab(){
  labWatchers();
  if (lab.si<lab.story.length && t>=lab.story[lab.si][0] && !dialogue){ lab.story[lab.si][1](); lab.si++; }
  if (dialogue){ advanceDialogue(); return; }

  if (lab.stun>0){ lab.stun--; }
  lab.alert = Math.max(0, lab.alert - 0.18);
  if (lab.zapCd>0) lab.zapCd--;

  // movement (blocked while stunned)
  if (lab.stun<=0){
    let dx=0,dy=0;
    if (down('a','arrowleft')) dx--; if (down('d','arrowright')) dx++;
    if (down('w','arrowup')) dy--; if (down('s','arrowdown')) dy++;
    if (dx||dy){ const m=Math.hypot(dx,dy); dx/=m; dy/=m; player.facing=dx<0?-1:dx>0?1:player.facing; }
    player.x+=dx*player.speed; player.y+=dy*player.speed;
  }
  const c=lab.cage, pad=beastR()+4;
  if (!lab.broken){ player.x=clamp(player.x,c.x+pad,c.x+c.w-pad); player.y=clamp(player.y,c.y+pad,c.y+c.h-pad); }
  else { player.x=clamp(player.x,20,W-20); player.y=clamp(player.y,20,H-40); }

  // SLAM
  if (lab.stun<=0 && justPressed(' ') && !lab.broken){
    sfx.slam(); addShake(6); ring(player.x,player.y,70,'#7d8896',3);
    spark(player.x,player.y,'#aab',10,4);
    let knockedOne=false;
    for (const s of lab.scraps){
      if (!s.knocked && dist(player.x,player.y,s.gx,s.gy)<60){ s.knocked=true; s.anim=1; knockedOne=true; spark(s.sx,s.sy,'#b8c0c8',12,3); }
    }
    const watched = anyoneWatching();
    lab.alert += watched ? 46 : (knockedOne?10:6);
    if (watched){ sfx.alarm(); }
    if (lab.alert>=lab.maxAlert && lab.zapCd<=0) zap();
  }

  // scrap fall animation + collect
  for (const s of lab.scraps){
    if (s.knocked && s.anim>0){ s.anim*=0.86; s.sx+=(s.gx-s.sx)*0.18; s.sy+=(s.gy-s.sy)*0.18; if (s.anim<0.05){ s.anim=0; s.sx=s.gx; s.sy=s.gy; } }
    if (s.knocked && !s.got && s.anim===0 && dist(player.x,player.y,s.gx,s.gy)<beastR()+12){
      s.got=true; player.scrap++; player.mass++; recalc(); sfx.pickup(); spark(s.gx,s.gy,'#cfe',14,4);
      const left=lab.scraps.filter(x=>!x.got).length;
      if (left>0) say('GB-7 (you)',["Scrap fused. ("+player.scrap+"/3) "+left+" more on the shelves."]);
    }
  }

  if (!lab.broken && lab.scraps.every(s=>s.got)){
    lab.broken=true; addShake(18); sfx.explode(); ring(c.x+c.w/2,c.y+c.h/2,220,'#fff',5);
    spark(c.x+c.w/2,c.y,'#fff',40,7);
    say('GB-7 (you)',["Three pieces. Enough to break iron. The bars are bending — I'm FREE.","Get to the door. The wild world is out there — and so are the armies."]);
  }
  if (lab.broken){
    const door={x:W-30,y:H/2};
    if (dist(player.x,player.y,door.x,door.y)<46 && !dialogue){ state=S.ESCAPE; escapeT=0; }
  }
}
function zap(){
  lab.zapCd=120; lab.stun=70; lab.alert=35;
  player.hp=Math.max(20, player.hp-15);
  sfx.zap(); addShake(16); ring(player.x,player.y,120,'#ff5050',4); spark(player.x,player.y,'#f55',24,6);
  say('CONTAINMENT',["⚡ SHOCK PROTOCOL ENGAGED ⚡","Stay quiet. Slam only when no one watches the cage."]);
}

let world, buildOpen=false;
const DAY_FRAMES = 60*12;
const BOSS_DAYS = [20,40,60,80];
function initWorld(){
  world = {
    cam:{x:0,y:0}, size:4600, day:1, dayT:0,

    enemies:[], bullets:[], bombs:[], shards:[], scraps:[], allies:[],

    "Inside the shop, press X for the BLACK MARKET — gold & prism buy a rainbow legion, overdrive, shields, repairs.",
    "Settlements dot the jungle: shelter behind walls to heal, or raze them for gold.",
    "On day 75 a secret VAULT opens. Mine DIAMONDS to forge the OMEGA CORE — the only thing that can kill what the scientists are building to end me on day 100."]);
}
const worldMsg = m => { world.msg=m; world.msgT=240; };
const enemyCap = () => 28 + Math.floor(world.day/4);

function spawnEnemy(type){
  const m=140, c=world.cam;
  const edge=Math.floor(rand(0,4));
  let x,y;
  if(edge===0){x=c.x-m;y=rand(c.y,c.y+H);} else if(edge===1){x=c.x+W+m;y=rand(c.y,c.y+H);}
  else if(edge===2){x=rand(c.x,c.x+W);y=c.y-m;} else {x=rand(c.x,c.x+W);y=c.y+H+m;}
  makeEnemy(clamp(x,0,world.size), clamp(y,0,world.size), type);
}
function makeEnemy(x,y,type){
  const D=world.day;
  const base={x,y,kx:0,ky:0,atkCd:rand(0,40),stun:0,type};
  if (type==='soldier') Object.assign(base,{hp:30+D*1.6,max:30+D*1.6,spd:0.95+D*0.012,color:D>50?'#5a3a3a':'#4a5d3a'});
  else if (type==='sniper') Object.assign(base,{hp:24+D,max:24+D,spd:0.7,range:300,color:'#5a4a2a'});
  else if (type==='tank') Object.assign(base,{hp:180+D*6,max:180+D*6,spd:0.45,r:22,color:'#3a3f30'});
  else if (type==='heli') Object.assign(base,{hp:60+D*2,max:60+D*2,spd:1.9,fly:true,color:'#2a3038'});
  world.enemies.push(base);
}
function spawnBoss(){
  const D=world.day;
  world.boss={ x:player.x, y:world.cam.y-160, kx:0,ky:0, hp:600+D*30, max:600+D*30, spd:0.6, atkCd:120, summonCd:200, type:'boss', stun:0 };
  worldMsg("⚔ WAR-GENERAL DEPLOYED ⚔  Defeat it or endure the day.");
  sfx.boss(); addShake(14);
  say('GENERAL',["GB-7. You were our masterpiece. Return to the lab or be scrapped.","...No? Then the human armies will bury you in this jungle."]);
}

function updateWorld(){
  if (dialogue){ advanceDialogue(); return; }
  if (justPressed('b')){ buildOpen=!buildOpen; if(buildOpen) shopTab='forge'; sfx.build(); }
  if (buildOpen){ updateBuild(); return; }

  // day clock (stops once the final boss is triggered)
  if (!world.finalTriggered){
    world.dayT++;
    if (world.dayT>=DAY_FRAMES){
      world.dayT=0; world.day++;
      player.hp=clamp(player.hp+15,0,player.maxHp);
      if (world.day>=100){ triggerFinal(); }
      else if (world.day===75){ worldMsg("DAY 75 — a hidden VAULT unlocks (B, then X to it). Mine DIAMONDS!"); }
      else worldMsg("DAY "+world.day+" survived. The armies grow bolder.");
    }
  }
  // boss trigger (regular war-generals)
  if (!world.boss && !world.finalBoss && BOSS_DAYS.includes(world.day) && !world.bossesDone.includes(world.day)){ world.bossesDone.push(world.day); spawnBoss(); }

  // energy regen
  player.energy=clamp(player.energy + 0.12 + player.parts.core*0.16, 0, player.maxEnergy);
  if (player.slamCd>0) player.slamCd--;
  if (player.empCd>0) player.empCd--;
  if (player.hurtCd>0) player.hurtCd--;

  // movement
  let dx=0,dy=0;
  if (down('a','arrowleft')) dx--; if (down('d','arrowright')) dx++;
  if (down('w','arrowup')) dy--; if (down('s','arrowdown')) dy++;
  if (dx||dy){ const m=Math.hypot(dx,dy); dx/=m; dy/=m; player.facing=dx<0?-1:dx>0?1:player.facing; }
  player.x=clamp(player.x+dx*player.speed,20,world.size-20);
  player.y=clamp(player.y+dy*player.speed,20,world.size-20);
  collideBuildings(player, beastR());
  collideTrees(player, beastR());
  world.cam.x=clamp(player.x-W/2,0,world.size-W);
  world.cam.y=clamp(player.y-H/2,0,world.size-H);

  // SLAM
  if (justPressed(' ') && player.slamCd<=0){
    player.slamCd=28; const R=slamRange();
    sfx.slam(); addShake(5); ring(player.x,player.y,R+10,'#3fd0c0',3); spark(player.x,player.y,'#3fd0c0',14,5);
    hitArea(player.x,player.y,R,slamDmg(),0.4);
    if (player.parts.weapon>=2){ const n=player.parts.weapon+2;
      for(let i=0;i<n;i++){ const a=i/n*TAU; world.shards.push({x:player.x,y:player.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,dmg:slamDmg()*0.5,life:40}); }
      sfx.shard(); }
  }
  // SPECIAL — EMP
  if (down('shift') && player.parts.core>=1 && player.energy>=40 && player.empCd<=0){
    player.empCd=40; player.energy-=40;
    sfx.emp(); addShake(18); ring(player.x,player.y,200,'#9ff',5); ring(player.x,player.y,150,'#fff',3);
    spark(player.x,player.y,'#9ff',30,7);
    hitArea(player.x,player.y,200,60*(1+player.parts.core*0.15),1.0,true);
    // wipe nearby bullets
    world.bullets=world.bullets.filter(b=>dist(b.x,b.y,player.x,player.y)>200);
  }
  // TENTACLES — passive auto-lash
  if (player.parts.tentacle>0){
    const lr=beastR()+22+player.parts.tentacle*16, dmg=(6+player.parts.tentacle*5)*dmgMult();
    if (t % Math.max(10, 24-player.parts.tentacle*2) === 0){
      let any=false;
      for(const e of world.enemies){ if(dist(player.x,player.y,e.x,e.y)<lr+(e.r||10)){ e.hp-=dmg; e.kx+=(e.x-player.x)*0.025; e.ky+=(e.y-player.y)*0.025; spark(e.x,e.y,'#c8a',4,3); any=true; } }
      if (world.boss && dist(player.x,player.y,world.boss.x,world.boss.y)<lr+34){ world.boss.hp-=dmg; any=true; }
      for(const town of world.towns){ if(town.razed) continue; for(const b of town.buildings){ if(b.dead) continue; const cx=clamp(player.x,b.x,b.x+b.w),cy=clamp(player.y,b.y,b.y+b.h); if(dist(player.x,player.y,cx,cy)<lr){ damageBuilding(town,b,dmg); any=true; } } }
      damageMinesInRadius(player.x,player.y,lr,dmg);
      if (damageTreesInRadius(player.x,player.y,lr,dmg)) any=true;
      if (world.finalBoss && hitFinalBoss(player.x,player.y,lr,dmg)) any=true;
      if (any){ ring(player.x,player.y,lr,'#9a7aaa',2); sfx.shard(); }
    }
  }
  // RAIL CANNON — long-range piercing hitscan at nearest foe
  if (player.parts.cannon>0){
    if (player.cannonCd>0) player.cannonCd--;
    if (player.cannonCd<=0){
      const range=420+player.parts.cannon*70;
      let tgt=null,bd=range;
      for(const e of world.enemies){ const dd=dist(player.x,player.y,e.x,e.y); if(dd<bd){bd=dd;tgt=e;} }
      if(!tgt && world.boss && dist(player.x,player.y,world.boss.x,world.boss.y)<range) tgt=world.boss;
      if(tgt){
        player.cannonCd=Math.max(18,56-player.parts.cannon*5);
        const ang=Math.atan2(tgt.y-player.y,tgt.x-player.x);
        const ex=player.x+Math.cos(ang)*range, ey=player.y+Math.sin(ang)*range;
        const dmg=(42+player.parts.cannon*22)*dmgMult();
        for(const e of world.enemies){ if(pointSegDist(e.x,e.y,player.x,player.y,ex,ey)<(e.r||10)+9){ e.hp-=dmg; spark(e.x,e.y,'#5fd0ff',5,4); } }
        if(world.boss && pointSegDist(world.boss.x,world.boss.y,player.x,player.y,ex,ey)<42) world.boss.hp-=dmg;
        if(world.finalBoss && pointSegDist(world.finalBoss.x,world.finalBoss.y,player.x,player.y,ex,ey)<70) hitFinalBoss(world.finalBoss.x,world.finalBoss.y,1,dmg);
        world.beams.push({x1:player.x,y1:player.y,x2:ex,y2:ey,life:8});
        addShake(2); sfx.shoot();
      }
    }
  }
  // MORTAR POD — lobs explosive shells onto distant foes
  if (player.parts.mortar>0){
    if (player.mortarCd>0) player.mortarCd--;
    if (player.mortarCd<=0){
      const cands=world.enemies.filter(e=>dist(player.x,player.y,e.x,e.y)<640);
      if(cands.length){
        player.mortarCd=Math.max(34,82-player.parts.mortar*7);
        const tg=cands[(Math.random()*cands.length)|0];
        world.shells.push({x:player.x,y:player.y,sx:player.x,sy:player.y,tx:tg.x+rand(-20,20),ty:tg.y+rand(-20,20),t:0,total:46,dmg:(34+player.parts.mortar*18)*dmgMult(),radius:60+player.parts.mortar*12});
      }
    }
  }
  // mortar shells fly & explode
  for(let i=world.shells.length-1;i>=0;i--){ const sh=world.shells[i]; sh.t++;
    const k=sh.t/sh.total; sh.x=sh.sx+(sh.tx-sh.sx)*k; sh.y=sh.sy+(sh.ty-sh.sy)*k;
    if(sh.t>=sh.total){
      sfx.explode(); addShake(7); ring(sh.tx,sh.ty,sh.radius,'#fa6',4); spark(sh.tx,sh.ty,'#fa6',20,5);
      for(const e of world.enemies){ if(dist(sh.tx,sh.ty,e.x,e.y)<sh.radius+(e.r||10)) e.hp-=sh.dmg; }
      if(world.boss && dist(sh.tx,sh.ty,world.boss.x,world.boss.y)<sh.radius+34) world.boss.hp-=sh.dmg;
      if(world.finalBoss) hitFinalBoss(sh.tx,sh.ty,sh.radius,sh.dmg);
      damageBuildingsInRadius(sh.tx,sh.ty,sh.radius,sh.dmg);
      damageMinesInRadius(sh.tx,sh.ty,sh.radius,sh.dmg);
      world.shells.splice(i,1);
    }
  }
  // cannon beam fade
  for(let i=world.beams.length-1;i>=0;i--){ if(--world.beams[i].life<=0) world.beams.splice(i,1); }
  // buff timers
  for(const kk in player.buffs){ if(player.buffs[kk]>0) player.buffs[kk]--; }

  // spawning (paused while a boss/final boss is active)
  if (!world.boss && !world.finalBoss){
    world.spawnCd--;
    if (world.spawnCd<=0 && world.enemies.length<enemyCap()){
      world.spawnCd=Math.max(36,120-world.day*1.8);
      const count=1+Math.floor(world.day/14);
      for(let i=0;i<count;i++) spawnEnemy(pickEnemyType());
    }
  }
  world.scrapCd--;
  if (world.scrapCd<=0 && world.scraps.length<40){ world.scrapCd=160; world.scraps.push({x:rand(100,world.size-100),y:rand(100,world.size-100),wob:rand(0,6),type:Math.random()<0.15?'gold':'iron'}); }

  updateEnemies();
  if (world.boss) updateBoss();
  if (world.finalBoss) updateFinalBoss();
  updateProjectiles();
  updateDinos();
  updateMines();
  updateTrees();

  // collect scrap
  for(let i=world.scraps.length-1;i>=0;i--){ const s=world.scraps[i];
    if (dist(player.x,player.y,s.x,s.y)<beastR()+12){ world.scraps.splice(i,1); sfx.pickup();
      if (s.type==='wood'){ player.wood++; spark(s.x,s.y,'#9a6a3a',10,4); continue; }
      player.mass++; recalc();
      if (s.type==='gold'){ player.gold++; spark(s.x,s.y,'#ffce4a',12,4); }
      else if (s.type==='prism'){ player.prism++; spark(s.x,s.y,'#f6f',14,5); }
      else if (s.type==='diamond'){ player.diamond++; spark(s.x,s.y,'#9ff',16,5); worldMsg('Diamond mined! ◇ '+player.diamond); }
      else { player.scrap++; spark(s.x,s.y,'#cfe',12,4); }
      player.hp=clamp(player.hp+6,0,player.maxHp);
      if (player.mass>=world.nextAlly){ world.nextAlly+=8;
        world.allies.push({x:player.x+rand(-30,30),y:player.y+rand(-30,30),hp:80,mass:rand(3,5)|0,facing:1});
        worldMsg("A freed beast joins your pack! Allies: "+world.allies.length); } } }

  // shelter: neutral settlements heal you and block fire with their walls
  for(const town of world.towns){ if(town.razed||town.hostile) continue;
    if(dist(player.x,player.y,town.x,town.y)<town.rad){ player.hp=clamp(player.hp+0.25,0,player.maxHp); } }

  // treasure chests — troves of scrap
  for(const ch of world.chests){ if(ch.opened) continue;
    if(dist(player.x,player.y,ch.x,ch.y)<beastR()+16){
      ch.opened=true; const n=8+(Math.random()*7|0);
      dropScrap(ch.x,ch.y,n,'iron'); dropScrap(ch.x,ch.y,1+(Math.random()*2|0),'gold');
      if (Math.random()<0.3) dropScrap(ch.x,ch.y,1,'prism');
      player.hp=clamp(player.hp+25,0,player.maxHp);
      sfx.pickup(); sfx.build(); addShake(5); ring(ch.x,ch.y,52,'#fd6',3); spark(ch.x,ch.y,'#fd6',22,5);
      worldMsg('Scrap trove! Iron + gold' + (Math.random()<0.3?' + prism':'')); } }

  // allies removed if dead handled in updateEnemies
  if (world.msgT>0) world.msgT--;
}
function pickEnemyType(){
  const D=world.day, r=Math.random();
  if (D>=60 && r<0.18) return 'heli';
  if (D>=30 && r<0.30) return 'tank';
  if (D>=12 && r<0.50) return 'sniper';
  return 'soldier';
}
function hitArea(x,y,R,dmg,knock,stun=false){
  for(const e of world.enemies){ const er=e.r||10; if (dist(x,y,e.x,e.y)<R+er){ e.hp-=dmg; e.kx+=(e.x-x)*knock*0.05; e.ky+=(e.y-y)*knock*0.05; if(stun) e.stun=60; spark(e.x,e.y,'#f55',6,4); } }
  if (world.boss && dist(x,y,world.boss.x,world.boss.y)<R+34){ world.boss.hp-=dmg; if(stun) world.boss.stun=40; spark(world.boss.x,world.boss.y,'#f55',8,4); }
  if (world.finalBoss) hitFinalBoss(x,y,R,dmg);
  damageBuildingsInRadius(x,y,R,dmg);
  damageMinesInRadius(x,y,R,dmg);
  damageTreesInRadius(x,y,R,dmg);
}
function hurtPlayer(raw, sx, sy){
  if (player.buffs.shield>0){ spark(player.x,player.y,'#5fd0ff',5,3); return; }
  const d=dmgTaken(raw); player.hp-=d; player.hurtCd=10; addShake(Math.min(8,raw*0.4)); sfx.hit();
  // repeated hits to the SAME spot punch a hole through the hull
  const ang = (sx!==undefined) ? Math.atan2(sy-player.y, sx-player.x) : rand(0,TAU);
  const covered = player.holes.some(h=>Math.abs(angDiff(h.ang,ang))<0.5);
  if (!covered){
    if (player.hitStreak && Math.abs(angDiff(player.hitStreak.ang,ang))<0.55){ player.hitStreak.n++; player.hitStreak.ang=player.hitStreak.ang*0.6+ang*0.4; }
    else player.hitStreak={ang, n:1};
    if (player.hitStreak.n>=4){
      player.holes.push({ang:player.hitStreak.ang, r:rand(3.5,5)}); player.hitStreak=null;
      spark(player.x+Math.cos(ang)*beastR()*0.5, player.y+Math.sin(ang)*beastR()*0.5,'#333',12,4); sfx.zap();
      if (state===S.WORLD) worldMsg('A hole is punched through your hull! (repair at the secret shop)');
    }
  }
  if (player.hp<=0){ player.hp=0; state=S.OVER; sfx.dead(); }
}
function updateEnemies(){
  const SLOW = player.buffs.slow>0?0.45:1;
  for(let i=world.enemies.length-1;i>=0;i--){
    const e=world.enemies[i];
    e.x+=e.kx; e.y+=e.ky; e.kx*=0.8; e.ky*=0.8;
    if (e.type==='soldier' && e.atkCd>0) e.atkCd--;
    if (e.stun>0){ e.stun--; }
    else {
      // target nearest of player/allies
      let tx=player.x,ty=player.y,td=dist(e.x,e.y,player.x,player.y);
      for(const a of world.allies){ const d=dist(e.x,e.y,a.x,a.y); if(d<td){td=d;tx=a.x;ty=a.y;} }
      const ang=Math.atan2(ty-e.y,tx-e.x);
      if (e.type==='sniper'){ // keep distance, shoot
        if (td>e.range) { e.x+=Math.cos(ang)*e.spd*SLOW; e.y+=Math.sin(ang)*e.spd*SLOW; }
        else if (td<e.range-60){ e.x-=Math.cos(ang)*e.spd*SLOW; e.y-=Math.sin(ang)*e.spd*SLOW; }
        if (e.atkCd-->0){} else { e.atkCd=110; fireBullet(e.x,e.y,player.x,player.y,5.5,10,'#ff3'); sfx.shoot(); }
      } else if (e.type==='tank'){
        e.x+=Math.cos(ang)*e.spd*SLOW; e.y+=Math.sin(ang)*e.spd*SLOW;
        if (e.atkCd-->0){} else { e.atkCd=130; fireBullet(e.x,e.y,player.x,player.y,3.2,26,'#fa3',7); sfx.shoot(); }
      } else if (e.type==='heli'){
        e.x+=Math.cos(ang)*e.spd*SLOW; e.y+=Math.sin(ang)*e.spd*SLOW;
        if (e.atkCd-->0){} else if (td<260){ e.atkCd=90; world.bombs.push({x:e.x,y:e.y+10,vy:0,life:60,dmg:30}); }
      } else { // soldier melee
        e.x+=Math.cos(ang)*e.spd*SLOW; e.y+=Math.sin(ang)*e.spd*SLOW;
      }
    }
    if (!e.fly){ collideBuildings(e, e.r||10); collideTrees(e, e.r||10); }
    // melee contact
    if (e.type==='soldier' || e.type==='tank'){
      if (dist(e.x,e.y,player.x,player.y)<beastR()+(e.r||10) && e.atkCd<=0 && e.type==='soldier'){ e.atkCd=45; hurtPlayer(6, e.x, e.y); }
    }
    // allies grind enemies
    for(const al of world.allies){ if (dist(e.x,e.y,al.x,al.y)<28){ e.hp-= al.invincible?3:0.6; if(!al.invincible) al.hp-=0.12; } }
    if (e.hp<=0){ spark(e.x,e.y,'#fa0',12,4);
      if(e.type==='tank'||e.type==='heli'){ sfx.explode(); addShake(6); ring(e.x,e.y,60,'#fa3',3); dropScrap(e.x,e.y,e.type==='tank'?3:2,'iron'); if(Math.random()<0.5) dropScrap(e.x,e.y,1,'gold'); }
      else if(Math.random()<0.12) dropScrap(e.x,e.y,1,'gold');
      world.enemies.splice(i,1); }
  }
  // ally upkeep
  for(let i=world.allies.length-1;i>=0;i--){ const al=world.allies[i];
    if (al.invincible && t>al.expire){ spark(al.x,al.y,'#fff',18,6); world.allies.splice(i,1); continue; }
    let best=null,bd=al.invincible?340:220; for(const e of world.enemies){ const d=dist(al.x,al.y,e.x,e.y); if(d<bd){bd=d;best=e;} }
    let tx=player.x+Math.cos(i)*40, ty=player.y+Math.sin(i)*40;
    if(best){ tx=best.x; ty=best.y; }
    const a=Math.atan2(ty-al.y,tx-al.x), d=dist(al.x,al.y,tx,ty), sp=al.invincible?2.7:1.9;
    if (d>20){ al.x+=Math.cos(a)*sp; al.y+=Math.sin(a)*sp; al.facing=Math.cos(a)<0?-1:1; }
    if (!al.invincible && al.hp<=0){ spark(al.x,al.y,'#aab',16,5); world.allies.splice(i,1); worldMsg("A pack-beast was destroyed. Allies: "+world.allies.length); }
  }
}
function dropScrap(x,y,n,type='iron'){ for(let i=0;i<n;i++) world.scraps.push({x:x+rand(-24,24),y:y+rand(-24,24),wob:rand(0,6),type}); }

/* ----- TOWNS & CITIES ----- */
function genTowns(){
  const n=12;
  for(let i=0;i<n;i++){
    let tx,ty,tries=0;
    do{ tx=rand(320,world.size-320); ty=rand(320,world.size-320); tries++; }
    while(dist(tx,ty,world.size/2,world.size/2)<460 && tries<25);
    const city = i>=7; // last five are bigger "cities"
    const town={ x:tx, y:ty, rad: city?170:130, buildings:[], hostile:false, razed:false, city };
    const bn = city ? 6+(Math.random()*3|0) : 3+(Math.random()*2|0);
    for(let b=0;b<bn;b++){
      const a=b/bn*TAU+rand(-0.25,0.25), dd=rand(45, town.rad-40);
      const bw=rand(40,66), bh=rand(36,56);
      town.buildings.push({ x:tx+Math.cos(a)*dd-bw/2, y:ty+Math.sin(a)*dd-bh/2, w:bw, h:bh, hp:city?130:90, max:city?130:90 });
    }
    world.towns.push(town);
    const cn = city?3:2;
    for(let c=0;c<cn;c++) world.chests.push({ x:tx+rand(-town.rad*0.6,town.rad*0.6), y:ty+rand(-town.rad*0.6,town.rad*0.6), opened:false });
  }
  for(let i=0;i<3;i++) world.chests.push({ x:rand(160,world.size-160), y:rand(160,world.size-160), opened:false });
}
function collideBuildings(o,r){
  for(const town of world.towns){ if(town.razed) continue; if(dist(o.x,o.y,town.x,town.y)>town.rad+r+50) continue;
    for(const b of town.buildings){ if(b.dead) continue;
      const cx=clamp(o.x,b.x,b.x+b.w), cy=clamp(o.y,b.y,b.y+b.h);
      const dx=o.x-cx, dy=o.y-cy, d=Math.hypot(dx,dy);
      if(d>0 && d<r){ const push=r-d; o.x+=dx/d*push; o.y+=dy/d*push; }
      else if(d===0){ o.x=b.x-r; }
    }
  }
}
function bulletBlocked(b){
  for(const town of world.towns){ if(town.razed) continue;
    for(const bu of town.buildings){ if(bu.dead) continue;
      if(b.x>bu.x&&b.x<bu.x+bu.w&&b.y>bu.y&&b.y<bu.y+bu.h) return true; } }
  return false;
}
function angerTown(town){
  if(town.hostile||town.razed) return;
  town.hostile=true; worldMsg("The settlement's guard turns hostile!");
  const g = town.city?4:3;
  for(let i=0;i<g;i++){ const a=rand(0,TAU); makeEnemy(town.x+Math.cos(a)*(town.rad+20), town.y+Math.sin(a)*(town.rad+20), 'soldier'); }
}
function damageBuilding(town,b,amount){
  if(b.dead) return;
  b.hp-=amount; spark(b.x+b.w/2,b.y+b.h/2,'#caa',5,3); angerTown(town);
  if(b.hp<=0){
    b.dead=true; sfx.explode(); addShake(8); ring(b.x+b.w/2,b.y+b.h/2,72,'#fa6',4);
    spark(b.x+b.w/2,b.y+b.h/2,'#fa6',18,5); dropScrap(b.x+b.w/2,b.y+b.h/2,4);
    if(town.buildings.every(x=>x.dead)){
      town.razed=true; dropScrap(town.x,town.y,town.city?14:8,'iron'); dropScrap(town.x,town.y,town.city?3:1,'gold');
      if(town.city) dropScrap(town.x,town.y,1,'prism');
      player.hp=clamp(player.hp+20,0,player.maxHp);
      worldMsg((town.city?'CITY':'SETTLEMENT')+' RAZED — rich salvage scattered!');
    }
  }
}
function damageBuildingsInRadius(x,y,R,dmg){
  for(const town of world.towns){ if(town.razed) continue;
    for(const b of town.buildings){ if(b.dead) continue;
      const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h);
      if(dist(x,y,cx,cy)<R) damageBuilding(town,b,dmg); } }
}
function drawBuilding(sx,sy,b,hostile){
  if(b.dead){
    ctx.fillStyle='#2a241c'; ctx.fillRect(sx,sy+b.h*0.45,b.w,b.h*0.55);
    ctx.fillStyle='#1d1812'; for(let i=0;i<4;i++) ctx.fillRect(sx+4+i*(b.w/4),sy+b.h*0.5+(i%2)*5,7,7);
    return;
  }
  ctx.fillStyle=hostile?'#5a4038':'#6b5440'; ctx.fillRect(sx,sy,b.w,b.h);
  ctx.strokeStyle='#3a2c1e'; ctx.lineWidth=2; ctx.strokeRect(sx,sy,b.w,b.h);
  ctx.fillStyle=hostile?'#7a3030':'#8a5a3a';
  ctx.beginPath(); ctx.moveTo(sx-4,sy); ctx.lineTo(sx+b.w/2,sy-16); ctx.lineTo(sx+b.w+4,sy); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a1c12'; ctx.fillRect(sx+b.w/2-5,sy+b.h-12,10,12);
  ctx.fillStyle=hostile?'#ffcf60':'#9cf'; ctx.fillRect(sx+6,sy+8,8,8);
  if(b.hp<b.max){ ctx.fillStyle='#400'; ctx.fillRect(sx,sy-22,b.w,3); ctx.fillStyle='#fa6'; ctx.fillRect(sx,sy-22,b.w*clamp(b.hp/b.max,0,1),3); }
}
function drawTowns(cx,cy){
  for(const town of world.towns){
    const sxc=town.x-cx, syc=town.y-cy;
    if(sxc<-300||sxc>W+300||syc<-300||syc>H+300) continue;
    if(!town.razed){ ctx.fillStyle=town.hostile?'rgba(150,40,30,0.12)':'rgba(180,160,90,0.10)';
      ctx.beginPath(); ctx.arc(sxc,syc,town.rad,0,TAU); ctx.fill(); }
    for(const b of town.buildings) drawBuilding(b.x-cx,b.y-cy,b,town.hostile);
  }
}
function drawChest(x,y,opened){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,9,12,3,0,0,TAU); ctx.fill();
  ctx.fillStyle=opened?'#5a4a30':'#7a5a2a'; ctx.fillRect(-10,-2,20,11);
  ctx.strokeStyle='#3a2a14'; ctx.lineWidth=1.5; ctx.strokeRect(-10,-2,20,11);
  if(opened){ ctx.fillStyle='#caa050'; ctx.save(); ctx.translate(-10,-2); ctx.rotate(-0.7); ctx.fillRect(0,-7,20,7); ctx.restore(); }
  else {
    ctx.fillStyle='#caa050'; ctx.fillRect(-10,-9,20,8);
    ctx.fillStyle='#3a2a14'; ctx.fillRect(-1,-9,2,20);
    ctx.fillStyle='#ffd86a'; ctx.beginPath(); ctx.arc(0,-1,2,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,216,106,'+(0.25+0.3*Math.sin(t*0.1))+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,15,0,TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ----- DIAMOND MINES ----- */
function genMines(){
  const n=4;
  for(let i=0;i<n;i++){
    let mx,my,tries=0;
    do{ mx=rand(280,world.size-280); my=rand(280,world.size-280); tries++; }
    while(tries<20 && world.towns.some(tn=>dist(mx,my,tn.x,tn.y)<260));
    const mine={ x:mx, y:my, rad:110, nodes:[] };
    const nn=5+(Math.random()*2|0);
    for(let k=0;k<nn;k++){ const a=k/nn*TAU, dd=rand(30,80);
      mine.nodes.push({ x:mx+Math.cos(a)*dd, y:my+Math.sin(a)*dd, hp:60, max:60, dead:false, regen:0 }); }
    world.mines.push(mine);
  }
}
function damageMinesInRadius(x,y,R,dmg){
  for(const mine of world.mines){ if(dist(x,y,mine.x,mine.y)>mine.rad+R+20) continue;
    for(const nd of mine.nodes){ if(nd.dead) continue;
      if(dist(x,y,nd.x,nd.y)<R+12){ nd.hp-=dmg; spark(nd.x,nd.y,'#9ff',5,3);
        if(nd.hp<=0){ nd.dead=true; nd.regen=600; sfx.pickup(); addShake(4); ring(nd.x,nd.y,40,'#9ff',3);
          dropScrap(nd.x,nd.y,1+(Math.random()*2|0),'diamond'); } } } }
}
function updateMines(){
  for(const mine of world.mines) for(const nd of mine.nodes){
    if(nd.dead){ if(--nd.regen<=0){ nd.dead=false; nd.hp=nd.max; spark(nd.x,nd.y,'#9ff',6,2); } } }
}

/* ----- TREES (solid, choppable for wood) ----- */
function collideTrees(o,r){
  for(const tr of world.trees){ if(tr.fallen) continue;
    const rr=r+5*tr.s, dx=o.x-tr.x, dy=o.y-tr.y;
    if(dx>rr||dx<-rr||dy>rr||dy<-rr) continue;
    const d=Math.hypot(dx,dy); if(d>0 && d<rr){ const push=rr-d; o.x+=dx/d*push; o.y+=dy/d*push; } }
}
function damageTreesInRadius(x,y,R,dmg){
  let hit=false;
  for(const tr of world.trees){ if(tr.fallen) continue;
    if(dist(x,y,tr.x,tr.y)<R+6*tr.s){ tr.hp-=dmg; hit=true; spark(tr.x,tr.y-10*tr.s,'#7a5a2a',3,2);
      if(tr.hp<=0){ tr.fallen=true; tr.fp=0; tr.fdir=(x<tr.x?1:-1);

function hitFinalBoss(x,y,R,dmg){
  const fb=world.finalBoss; if(!fb) return false;
  if(dist(x,y,fb.x,fb.y)>R+66) return false;
  if(!player.omega){ fb.shieldFlash=6; if(t%5===0) spark(fb.x+rand(-50,50),fb.y+rand(-50,50),'#5fd0ff',3,3); return false; }
  fb.hp-=dmg; fb.hitFlash=4; return true;
}

  const fb=world.finalBoss;
  fb.x+=fb.kx; fb.y+=fb.ky; fb.kx*=0.9; fb.ky*=0.9;
  // anchored near the TOP of the screen, sliding sideways to loom over the beast
  const tx=clamp(player.x, world.cam.x+110, world.cam.x+W-110);
  fb.x += (tx-fb.x)*0.04;
  fb.y += (world.cam.y+110 - fb.y)*0.09;
  const a=Math.atan2(player.y-fb.y,player.x-fb.x);
  if(--fb.atkCd<=0){ fb.atkCd=72;
    for(let k=-3;k<=3;k++){ const aa=a+k*0.17; world.bullets.push({x:fb.x,y:fb.y,vx:Math.cos(aa)*5,vy:Math.sin(aa)*5,dmg:16,r:7,color:'#f66',life:260}); } sfx.shoot(); }
  if(--fb.summonCd<=0){ fb.summonCd=150; const types=['soldier','sniper','tank','heli']; for(let k=0;k<3;k++) makeEnemy(fb.x+rand(-70,70),fb.y+rand(-70,70),types[(Math.random()*types.length)|0]); }
  if(--fb.sweepCd<=0){ fb.sweepCd=320; sfx.emp(); addShake(8); ring(fb.x,fb.y,200,'#fa6',4);
    for(let k=0;k<18;k++){ const aa=k/18*TAU; world.bullets.push({x:fb.x,y:fb.y,vx:Math.cos(aa)*3.6,vy:Math.sin(aa)*3.6,dmg:14,r:6,color:'#fa6',life:280}); } }
  if(fb.shieldFlash>0) fb.shieldFlash--;
  if(fb.hitFlash>0) fb.hitFlash--;
  if(dist(fb.x,fb.y,player.x,player.y)<beastR()+62){ if(t%24===0) hurtPlayer(14, fb.x, fb.y); }
  if(fb.hp<=0){
    sfx.explode(); addShake(40);
    for(let i=0;i<7;i++) ring(fb.x+rand(-70,70),fb.y+rand(-70,70),300,'#fff',6);

function updateProjectiles(){
  for(let i=world.bullets.length-1;i>=0;i--){ const b=world.bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    if (bulletBlocked(b)){ spark(b.x,b.y,'#caa',4,2); world.bullets.splice(i,1); continue; }
    if (dist(b.x,b.y,player.x,player.y)<beastR()+b.r){ hurtPlayer(b.dmg, b.x, b.y); spark(b.x,b.y,'#f55',6,3); world.bullets.splice(i,1); continue; }
    if (b.life<=0) world.bullets.splice(i,1); }
  for(let i=world.bombs.length-1;i>=0;i--){ const bo=world.bombs[i]; bo.life--;
    if (bo.life<=0){ sfx.explode(); addShake(8); ring(bo.x,bo.y,80,'#fa3',4); spark(bo.x,bo.y,'#fa3',20,5);
      if (dist(bo.x,bo.y,player.x,player.y)<80+beastR()) hurtPlayer(bo.dmg, bo.x, bo.y); world.bombs.splice(i,1); } }
  for(let i=world.shards.length-1;i>=0;i--){ const s=world.shards[i]; s.x+=s.vx; s.y+=s.vy; s.life--;
    let hit=false;
    for(const e of world.enemies){ if (dist(s.x,s.y,e.x,e.y)<(e.r||10)+4){ e.hp-=s.dmg; spark(s.x,s.y,'#f55',4,3); hit=true; break; } }
    if (!hit && world.boss && dist(s.x,s.y,world.boss.x,world.boss.y)<38){ world.boss.hp-=s.dmg; hit=true; }
    if (!hit && world.finalBoss && dist(s.x,s.y,world.finalBoss.x,world.finalBoss.y)<70){ hitFinalBoss(world.finalBoss.x,world.finalBoss.y,1,s.dmg); hit=true; }
    if (!hit){ for(const town of world.towns){ if(town.razed) continue; for(const b of town.buildings){ if(b.dead) continue;
      if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){ damageBuilding(town,b,s.dmg); hit=true; break; } } if(hit) break; } }
    if (hit||s.life<=0) world.shards.splice(i,1); }
}

function drawWorld(){
  const cx=world.cam.x, cy=world.cam.y;
  ctx.save(); const ssx=(Math.random()-0.5)*shake, ssy=(Math.random()-0.5)*shake; ctx.translate(ssx,ssy);

  ctx.fillStyle='rgba(20,10,40,'+(0.28*Math.sin(dprog*Math.PI))+')'; ctx.fillRect(0,0,W,H);

  // dinos (ambient, behind trees)
  for(const d of world.dinos){ const dx=d.x-cx, dy=d.y-cy; if(dx<-120||dx>W+120||dy<-120||dy>H+120) continue; drawDino(dx,dy,d.s,d.kind); }

  for(const s of world.scraps){ const sx=s.x-cx, sy=s.y-cy; if(sx<-20||sx>W+20||sy<-20||sy>H+20) continue; s.wob+=0.05; drawScrap(sx,sy,s.wob,s.type); }

  for(const al of world.allies){ drawBeast(al.x-cx,al.y-cy,allyDesc(al),al.facing||1,false,al.rainbow);
    if (al.invincible){ ctx.strokeStyle=`hsl(${(t*8+al.x)%360},90%,60%)`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(al.x-cx,al.y-cy,26,0,TAU); ctx.stroke(); }

  for(const e of world.enemies){ const ex=e.x-cx, ey=e.y-cy; if(ex<-60||ex>W+60||ey<-60||ey>H+60) continue;
    if(e.type==='sniper') drawSniper(ex,ey,e); else if(e.type==='tank') drawTank(ex,ey,e); else if(e.type==='heli') drawHeli(ex,ey,e); else drawSoldier(ex,ey,e);
    const bw=e.type==='tank'?44:18; ctx.fillStyle='#400'; ctx.fillRect(ex-bw/2,ey-(e.type==='heli'?26:24),bw,3);
    ctx.fillStyle='#f55'; ctx.fillRect(ex-bw/2,ey-(e.type==='heli'?26:24),bw*clamp(e.hp/e.max,0,1),3); }

  if (world.boss){ const b=world.boss; drawBoss(b.x-cx,b.y-cy,b); }
  if (world.finalBoss){ const fb=world.finalBoss; drawFinalBoss(fb.x-cx,fb.y-cy,fb); }

  // mortar shells (arcing, with target marker)

    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(sh.x-cx,sh.y-cy,4,2,0,0,TAU); ctx.fill();

  if (world.msgT>0){ ctx.globalAlpha=clamp(world.msgT/60,0,1); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 22px Courier New'; ctx.fillText(world.msg,W/2,100); ctx.textAlign='left'; ctx.globalAlpha=1; }
  drawMinimap();
}
function drawMinimap(){
  const sz=150, pad=12, mx=W-sz-pad, my=H-sz-pad, sc=sz/world.size;
  ctx.fillStyle='rgba(6,14,8,0.78)'; ctx.fillRect(mx,my,sz,sz);
  ctx.strokeStyle='#3a5a3a'; ctx.lineWidth=2; ctx.strokeRect(mx,my,sz,sz);
  const px=(x)=>mx+x*sc, py=(y)=>my+y*sc;
  // mines (diamond)
  for(const mn of world.mines){ ctx.fillStyle='#9ff'; ctx.beginPath();
    const dx=px(mn.x),dy=py(mn.y); ctx.moveTo(dx,dy-3); ctx.lineTo(dx+3,dy); ctx.lineTo(dx,dy+3); ctx.lineTo(dx-3,dy); ctx.closePath(); ctx.fill(); }
  // towns / cities
  for(const tn of world.towns){ if(tn.razed){ ctx.fillStyle='#544'; } else ctx.fillStyle=tn.hostile?'#c44':(tn.city?'#fd6':'#b8935a');
    const s=tn.city?5:3; ctx.fillRect(px(tn.x)-s/2,py(tn.y)-s/2,s,s); }
  // chests
  for(const ch of world.chests){ if(ch.opened) continue; ctx.fillStyle='#ffd86a'; ctx.fillRect(px(ch.x)-1,py(ch.y)-1,2,2); }
  // boss / final boss
  if(world.boss){ ctx.fillStyle='#f33'; ctx.beginPath(); ctx.arc(px(world.boss.x),py(world.boss.y),3,0,TAU); ctx.fill(); }
  if(world.finalBoss){ ctx.fillStyle=(t%20<10)?'#f33':'#fff'; ctx.beginPath(); ctx.arc(px(world.finalBoss.x),py(world.finalBoss.y),5,0,TAU); ctx.fill(); }
  // player
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px(player.x),py(player.y),3,0,TAU); ctx.fill();
  ctx.strokeStyle='#9aa'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px(player.x),py(player.y),3,0,TAU); ctx.stroke();
  // legend
  ctx.fillStyle='#9ab'; ctx.font='9px Courier New'; ctx.fillText('◇mine ▪town ★city ·chest',mx+3,my-3);
}

/* ============================================================ BUILD MENU + SECRET SHOP */
let shopTab='forge';
const PARTS = [
  { key:'armor',   name:'ARMOR PLATING',  desc:'+40 max HP · -16% damage taken' },
  { key:'speed',   name:'PISTON LEGS',    desc:'+movement speed' },
  { key:'weapon',  name:'SLAM WEAPONRY',  desc:'+slam damage/range · Lv2+ fires shards' },
  { key:'core',    name:'GENERATOR CORE', desc:'unlocks SHIFT=EMP · +energy · +HP' },
  { key:'tentacle',name:'SCRAP TENTACLES',desc:'auto-lash foes & buildings · fell TREES for wood' },
  { key:'cannon',  name:'RAIL CANNON',    desc:'LONG-RANGE piercing auto-beam at nearest foe' },
  { key:'mortar',  name:'MORTAR POD',     desc:'auto-lobs EXPLOSIVE shells onto distant foes' },
];
const partCost = lvl => 3 + lvl*2;
function summonLegion(){
  const n=4; for(let i=0;i<n;i++){ const a=i/n*TAU;
    world.allies.push({x:player.x+Math.cos(a)*44,y:player.y+Math.sin(a)*44,hp:99999,mass:5,facing:1,rainbow:true,invincible:true,expire:t+15*60}); }
  ring(player.x,player.y,120,'#f6f',4); worldMsg('RAINBOW LEGION summoned — invincible for 15s!');
}
function armageddon(){
  sfx.explode(); addShake(26); ring(player.x,player.y,540,'#fff',6); ring(player.x,player.y,420,'#fa3',5);
  for(let i=world.enemies.length-1;i>=0;i--){ const e=world.enemies[i]; if(dist(e.x,e.y,player.x,player.y)<580){ spark(e.x,e.y,'#fa3',8,5); dropScrap(e.x,e.y,1,'iron'); world.enemies.splice(i,1); } }
  if(world.boss) world.boss.hp-=700;
  world.bullets=world.bullets.filter(b=>dist(b.x,b.y,player.x,player.y)>580);
  worldMsg('ARMAGEDDON unleashed!');
}
const SECRET = [
  { name:'RAINBOW LEGION', desc:'Summon 4 INVINCIBLE rainbow minions for 15s', cost:{gold:3,prism:0}, act:summonLegion },
  { name:'OVERDRIVE',      desc:'+70% damage to ALL weapons for 12s',          cost:{gold:2,prism:0}, act:()=>{player.buffs.overdrive=12*60;} },
  { name:'AEGIS SHIELD',   desc:'Total invincibility for 6s',                  cost:{gold:2,prism:0}, act:()=>{player.buffs.shield=6*60;} },
  { name:'TIME WARP',      desc:'Slow every enemy to a crawl for 8s',          cost:{gold:2,prism:0}, act:()=>{player.buffs.slow=8*60;} },
  { name:'NANO-REPAIR',    desc:'Full heal + seal every hull hole',            cost:{gold:1,prism:0}, act:()=>{player.hp=player.maxHp; player.holes=[]; player.hitStreak=null;} },
  { name:'ARMAGEDDON',     desc:'Annihilate all nearby foes — needs PRISM',    cost:{gold:0,prism:1}, act:armageddon },
  { name:'SCRAP CRATE',    desc:'Trade felled WOOD for a crate of iron scrap', cost:{wood:8},  act:()=>{dropScrap(player.x,player.y,8,'iron'); worldMsg('Lumber traded for a scrap crate!');} },
  { name:'SUPPLY DROP',    desc:'Trade WOOD for mixed scrap + gold',           cost:{wood:18}, act:()=>{dropScrap(player.x,player.y,7,'iron'); dropScrap(player.x,player.y,2,'gold'); worldMsg('Supply drop delivered!');} },
];
// ----- day-75 SECRET VAULT (diamonds only) -----
function antimatter(){ const fb=world.finalBoss;
  if(fb){ fb.hp-=900; fb.hitFlash=8; sfx.explode(); addShake(30); ring(fb.x,fb.y,320,'#9ff',6); spark(fb.x,fb.y,'#9ff',40,8); worldMsg('ANTIMATTER STRIKE tears into the Lab-Mecha!'); }
  else worldMsg('Antimatter strike has no target — save it for the Lab-Mecha.'); }
function diamondLegion(){ for(let i=0;i<4;i++){ const a=i/4*TAU; world.allies.push({x:player.x+Math.cos(a)*44,y:player.y+Math.sin(a)*44,hp:400,mass:5,facing:1,crystal:true}); }
  ring(player.x,player.y,110,'#9ff',4); worldMsg('Diamond legion forged!'); }
const VAULT = [
  { name:'OMEGA CORE',       desc:'The ONLY thing that pierces the Lab-Mecha shield', cost:{diamond:4}, act:()=>{player.omega=true; worldMsg('OMEGA CORE installed — your weapons can now harm the Lab-Mecha!');}, owned:()=>player.omega },
  { name:'ANTIMATTER STRIKE', desc:'Bypass the shield: huge instant damage to final boss', cost:{diamond:2}, act:antimatter },
  { name:'PHOENIX PROTOCOL',  desc:'Full heal, seal all holes, 10s invincibility',        cost:{diamond:3}, act:()=>{player.hp=player.maxHp; player.holes=[]; player.hitStreak=null; player.buffs.shield=10*60;} },
  { name:'DIAMOND LEGION',    desc:'4 durable crystal minions (permanent)',               cost:{diamond:3}, act:diamondLegion },
];
const canAfford = c => (player.gold>=(c.gold||0)) && (player.prism>=(c.prism||0)) && (player.diamond>=(c.diamond||0)) && (player.wood>=(c.wood||0));
const costStr = c => { const a=[]; if(c.wood)a.push('▤'+c.wood); if(c.gold)a.push('★'+c.gold); if(c.prism)a.push('◆'+c.prism); if(c.diamond)a.push('◇'+c.diamond); return a.join('  ')||'free'; };
const payCost = c => { player.gold-=(c.gold||0); player.prism-=(c.prism||0); player.diamond-=(c.diamond||0); player.wood-=(c.wood||0); };
function buyPart(i){ const p=PARTS[i], lvl=player.parts[p.key], cost=partCost(lvl);
  if (player.scrap>=cost && lvl<6){ player.scrap-=cost; player.parts[p.key]++; recalc(); sfx.build(); spark(player.x,player.y,'#3fd0c0',16,5); } else sfx.hit(); }
function buySecret(i){ const it=SECRET[i];
  if (canAfford(it.cost)){ payCost(it.cost); it.act(); sfx.build(); spark(player.x,player.y,'#fd6',20,6); } else sfx.hit(); }
function buyVault(i){ const it=VAULT[i];
  if (it.owned && it.owned()){ sfx.hit(); return; }
  if (canAfford(it.cost)){ payCost(it.cost); it.act(); sfx.build(); spark(player.x,player.y,'#9ff',22,6); } else sfx.hit(); }
function cycleTab(){ const tabs=['forge','secret']; if(world && world.day>=75) tabs.push('vault'); let i=tabs.indexOf(shopTab); if(i<0)i=0; shopTab=tabs[(i+1)%tabs.length]; }
function updateBuild(){
  if (justPressed('x')){ cycleTab(); sfx.build(); return; }
  if (shopTab==='forge'){ for(let i=0;i<PARTS.length;i++) if(justPressed(String(i+1))) buyPart(i); }
  else if (shopTab==='secret'){ for(let i=0;i<SECRET.length;i++) if(justPressed(String(i+1))) buySecret(i); }
  else { for(let i=0;i<VAULT.length;i++) if(justPressed(String(i+1))) buyVault(i); }
}
function drawCurrencies(y){
  ctx.textAlign='center'; ctx.font='14px Courier New';
  ctx.fillStyle='#cfe';    ctx.fillText('⚙ '+player.scrap,  W/2-240, y);
  ctx.fillStyle='#b9844f'; ctx.fillText('▤ '+player.wood,    W/2-120, y);
  ctx.fillStyle='#ffce4a'; ctx.fillText('★ '+player.gold,    W/2,     y);
  ctx.fillStyle='#f6f';    ctx.fillText('◆ '+player.prism,   W/2+120, y);
  ctx.fillStyle='#9ff';    ctx.fillText('◇ '+player.diamond, W/2+240, y);
  ctx.textAlign='left';
}
function drawBuild(){
  ctx.fillStyle='rgba(4,8,12,0.9)'; ctx.fillRect(0,0,W,H);
  drawBeast(150,H/2,playerDesc(),1,false, player.buffs.shield>0);
  const vaultOpen = world && world.day>=75;
  ctx.textAlign='center';
  ctx.font='bold 22px Courier New';
  ctx.fillStyle=shopTab==='forge'?'#3fd0c0':'#788'; ctx.fillText('⚒ FORGE', W/2-260, 42);
  ctx.fillStyle=shopTab==='secret'?'#fd6':'#788';   ctx.fillText('★ BLACK MARKET', W/2, 42);
  ctx.fillStyle=shopTab==='vault'?'#9ff':(vaultOpen?'#788':'#344'); ctx.fillText(vaultOpen?'◇ SECRET VAULT':'◇ ??? (day 75)', W/2+250, 42);
  ctx.fillStyle='#678'; ctx.font='13px Courier New'; ctx.fillText('[X] switch shop   ·   press a number to buy   ·   [B] close', W/2, 64);
  drawCurrencies(86);
  ctx.textAlign='left';
  const x=336, y0=106, rowH=62, bw=576;
  if (shopTab==='vault'){
    for(let i=0;i<VAULT.length;i++){ const it=VAULT[i], y=y0+i*rowH, own=it.owned&&it.owned(), can=!own&&canAfford(it.cost);
      ctx.fillStyle=own?'rgba(110,255,170,0.1)':(can?'rgba(159,247,255,0.1)':'rgba(80,80,90,0.07)'); ctx.fillRect(x,y,bw,rowH-10);
      ctx.strokeStyle=own?'#6f8':(can?'#9ff':'#445'); ctx.lineWidth=2; ctx.strokeRect(x,y,bw,rowH-10);
      ctx.fillStyle='#fff'; ctx.font='bold 18px Courier New'; ctx.fillText((i+1)+'. '+it.name,x+14,y+24);
      ctx.fillStyle='#bdf'; ctx.font='12px Courier New'; ctx.fillText(it.desc,x+14,y+44);
      ctx.fillStyle=own?'#6f8':(can?'#9ff':'#a55'); ctx.font='bold 15px Courier New'; ctx.textAlign='right'; ctx.fillText(own?'OWNED':costStr(it.cost),x+bw-14,y+36); ctx.textAlign='left'; }
    ctx.textAlign='center'; ctx.fillStyle='#9ff'; ctx.font='13px Courier New';
    ctx.fillText('Diamonds come only from MINES out in the jungle — slam the glowing nodes.', W/2, y0+VAULT.length*rowH+24); ctx.textAlign='left';
    return;
  }
  if (shopTab==='forge'){
    for(let i=0;i<PARTS.length;i++){ const p=PARTS[i], lvl=player.parts[p.key], cost=partCost(lvl), y=y0+i*rowH, can=player.scrap>=cost && lvl<6;
      ctx.fillStyle=can?'rgba(63,208,192,0.1)':'rgba(80,80,90,0.07)'; ctx.fillRect(x,y,bw,rowH-10);
      ctx.strokeStyle=can?'#3fd0c0':'#445'; ctx.lineWidth=2; ctx.strokeRect(x,y,bw,rowH-10);
      ctx.fillStyle='#fff'; ctx.font='bold 18px Courier New'; ctx.fillText((i+1)+'. '+p.name,x+14,y+24);
      ctx.fillStyle='#9bd'; ctx.font='12px Courier New'; ctx.fillText(p.desc,x+14,y+44);
      for(let k=0;k<6;k++){ ctx.fillStyle=k<lvl?'#3fd0c0':'#334'; ctx.fillRect(x+410+k*14,y+11,10,10); }
      ctx.fillStyle=lvl>=6?'#6f8':(can?'#fff':'#a55'); ctx.font='13px Courier New'; ctx.fillText(lvl>=6?'MAX':('⚙ '+cost),x+410,y+44);
    }
  } else {
    for(let i=0;i<SECRET.length;i++){ const it=SECRET[i], y=y0+i*rowH, can=canAfford(it.cost);
      ctx.fillStyle=can?'rgba(255,210,90,0.1)':'rgba(80,80,90,0.07)'; ctx.fillRect(x,y,bw,rowH-10);
      ctx.strokeStyle=can?'#fd6':'#445'; ctx.lineWidth=2; ctx.strokeRect(x,y,bw,rowH-10);
      ctx.fillStyle='#fff'; ctx.font='bold 18px Courier New'; ctx.fillText((i+1)+'. '+it.name,x+14,y+24);
      ctx.fillStyle='#dca'; ctx.font='12px Courier New'; ctx.fillText(it.desc,x+14,y+44);
      ctx.fillStyle=can?'#ffce4a':'#a55'; ctx.font='bold 15px Courier New'; ctx.textAlign='right'; ctx.fillText(costStr(it.cost),x+bw-14,y+36); ctx.textAlign='left';
    }
  }
}

/* ============================================================ END SCREENS */
function drawOver(){
  ctx.fillStyle='#1a0606'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f55'; ctx.font='bold 48px Courier New'; ctx.fillText('THE BEAST FALLS',W/2,H/2-40);
  ctx.fillStyle='#caa'; ctx.font='20px Courier New'; ctx.fillText('You survived to Day '+(world?world.day:1)+'. The armies reclaim the wild.',W/2,H/2+4);
  ctx.fillStyle=(Math.sin(t*0.1)>0)?'#fff':'#789'; ctx.font='18px Courier New'; ctx.fillText('PRESS ENTER to rise again',W/2,H/2+60);
  ctx.textAlign='left';
}
function drawWin(){
  ctx.fillStyle='#06140d'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ const x=(i*137+t)%W, y=(i*83)%H; ctx.fillStyle='rgba(63,208,192,0.3)'; ctx.fillRect(x,y,2,2); }
  drawBeast(W/2,H/2-20,playerDesc(),1,false);
  ctx.textAlign='center'; ctx.fillStyle='#3fd0c0'; ctx.font='bold 44px Courier New'; ctx.fillText('THE LAB-MECHA FALLS',W/2,116);
  ctx.fillStyle='#dfe'; ctx.font='20px Courier New';
  ctx.fillText('100 days survived. The laboratory that forged you is rubble.',W/2,H-116);
  ctx.fillText('Built to destroy the world, you chose to defend it.',W/2,H-88);
  ctx.fillText('The wild is safe — for now.',W/2,H-60);
  ctx.fillStyle=(Math.sin(t*0.1)>0)?'#fff':'#789'; ctx.font='18px Courier New'; ctx.fillText('PRESS ENTER to play again',W/2,H-44);
  ctx.textAlign='left';
}

/* ============================================================ LOOP */
function loop(){
  t++; shake*=0.9; if (shake<0.2) shake=0;
  switch(state){
    case S.TITLE: drawTitle(); if(justPressed('enter')){ t=0; initLab(); } break;
    case S.LAB: updateLab(); drawLab(); break;
    case S.ESCAPE: updateEscape(); drawEscape(); break;
    case S.WORLD: updateWorld(); drawWorld(); break;
    case S.OVER: drawOver(); if(justPressed('enter')) state=S.TITLE; break;
    case S.WIN: drawWin(); if(justPressed('enter')) state=S.TITLE; break;
  }
  if (state===S.LAB || state===S.WORLD){ if(!(state===S.WORLD&&buildOpen)) { updateParts(); updateRings(); } }
  requestAnimationFrame(loop);
}
loop();
</script>
